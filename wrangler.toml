name = "tickets"
main = "crates/worker/build/worker/shim.mjs"
compatibility_date = "2026-10-27"
compatibility_flags = []
# Standard usage model is automatic in Wrangler 4; infra-check verifies it.
logpush = false
tail_consumers = []
workers_dev = false
preview_urls = false

[placement]
mode = "off"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[build]
command = "cd crates/worker && worker-build --release"

[assets]
directory = "crates/web/dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "tickets"
# Local-only placeholder; replace only during explicitly authorized provisioning.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Workers Paid approved in TIK-88; billing is an owner action, never selected here.
[env.production]
name = "tickets-production"
compatibility_date = "2026-10-27"
compatibility_flags = []
logpush = false
tail_consumers = []
workers_dev = false
preview_urls = false
routes = [{ pattern = "tickets.worldwidewebb.co", custom_domain = true }]

[env.production.placement]
mode = "off"

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

# D1 bindings are not inherited by named environments.
[[env.production.d1_databases]]
binding = "DB"
database_name = "tickets"
database_id = "aac62c45-1f61-4858-956f-c0e4556b52ab"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "BOARD_ROOMS"
class_name = "BoardRoom"

[[migrations]]
tag = "v1-board-room"
new_sqlite_classes = ["BoardRoom"]

[[env.production.durable_objects.bindings]]
name = "BOARD_ROOMS"
class_name = "BoardRoom"

[vars]
GITHUB_PR_OWNERS = "0x63616c"

[env.production.vars]
GITHUB_PR_OWNERS = "0x63616c"

# Reclaim expired ticket leases; no issue reconciliation.
[triggers]
crons = ["* * * * *"]

[env.production.triggers]
crons = ["* * * * *"]
