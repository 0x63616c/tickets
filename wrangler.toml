name = "tickets"
main = "crates/worker/build/worker/shim.mjs"
compatibility_date = "2026-10-27"

[build]
command = "cd crates/worker && worker-build --release"

[assets]
directory = "crates/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "tickets"
# Local-only placeholder; replace only during explicitly authorized provisioning.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
