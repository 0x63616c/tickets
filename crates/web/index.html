<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Tickets</title>
  <script>
    // Retire the old preference before the app starts; unavailable storage is harmless.
    try { localStorage.removeItem("tickets.theme"); } catch (_) {}
    try {
      const font = localStorage.getItem("tickets.font");
      if (["geist", "geist-mono", "inter", "system"].includes(font)) {
        document.documentElement.dataset.font = font;
      }
    } catch (_) {}
  </script>
  <link data-trunk rel="copy-file" href="icons/favicon.svg">
  <link data-trunk rel="copy-file" href="icons/favicon-32.png">
  <link data-trunk rel="copy-file" href="icons/apple-touch-icon.png">

  <link data-trunk rel="copy-file" href="icons/icon-192.png">
  <link data-trunk rel="copy-file" href="icons/icon-512.png">
  <link data-trunk rel="copy-file" href="icons/icon-maskable-512.png">
  <link data-trunk rel="copy-file" href="icons/site.webmanifest">

  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#000000">
