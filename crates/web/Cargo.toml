[package]
name = "tickets-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = "0.7.0"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
serde_json = "1.0.154"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard", "HtmlDialogElement", "HtmlDetailsElement", "HtmlInputElement", "HtmlElement", "DataTransfer", "DragEvent", "KeyboardEvent", "NodeList"] }
