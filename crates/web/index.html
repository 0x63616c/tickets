<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Tickets</title>
  <script>
    // Retire the old preference before the app starts; unavailable storage is harmless.
    try { localStorage.removeItem("tickets.theme"); } catch (_) {}
    try {
      const font = localStorage.getItem("tickets.font");
      if (["geist", "geist-mono", "inter", "system"].includes(font)) {
        document.documentElement.dataset.font = font;
      }
    } catch (_) {}
  </script>
  <link data-trunk rel="copy-file" href="icons/favicon.svg">
  <link data-trunk rel="copy-file" href="icons/favicon-32.png">
  <link data-trunk rel="copy-file" href="icons/apple-touch-icon.png">
  <link data-trunk rel="copy-file" href="icons/favicon.ico">
  <link data-trunk rel="copy-file" href="icons/icon-192.png">
  <link data-trunk rel="copy-file" href="icons/icon-512.png">
  <link data-trunk rel="copy-file" href="icons/icon-maskable-512.png">
  <link data-trunk rel="copy-file" href="icons/site.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#000000">
  <link data-trunk rel="rust" data-wasm-opt="z">
  <link data-trunk rel="copy-dir" href="fonts">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/Geist.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/GeistMono.woff2">
  <link data-trunk rel="css" href="style/tokens.css">
  <link data-trunk rel="css" href="style/splash.css">
  <link data-trunk rel="css" href="style.css">
  <link data-trunk rel="css" href="style/foundation.css">
  <link data-trunk rel="css" href="style/settings.css">
  <link data-trunk rel="css" href="style/appearance.css">
  <link data-trunk rel="css" href="style/home.css">
  <link data-trunk rel="css" href="style/analytics.css">
  <link data-trunk rel="css" href="style/mission.css">
  <link data-trunk rel="css" href="style/palette.css">
</head>
<body>
  <div id="boot-splash">
    <div class="boot-mark"><div class="boot-sway">
      <div class="boot-grid" aria-hidden="true">
        <div class="boot-piece boot-main"><pre class="boot-edge"></pre><pre class="boot-body"></pre></div>
        <div class="boot-piece boot-stub"><pre class="boot-edge"></pre><pre class="boot-body"></pre></div>
      </div>
    </div></div>
    <span class="sr-only" role="status">Loading Tickets</span>
  </div>
  <script>
    (() => {
      const splash = document.getElementById("boot-splash");
      if (location.pathname.startsWith("/design/c/") ||
          (navigator.webdriver && !new URLSearchParams(location.search).has("splash"))) {
        splash.remove();
        return;
      }
      const art = splash.querySelector("pre");
      const pieces = Array.from(splash.querySelectorAll(".boot-piece"), element => ({
        edge: element.querySelector(".boot-edge"),
        body: element.querySelector(".boot-body"),
        cells: [], bodyBuffer: [], edgeBuffer: [], bodyText: null, edgeText: null,
      }));
      const media = matchMedia("(prefers-reduced-motion: reduce)");
      const reduced = () => {
        let storedReduce = false;
        try { storedReduce = localStorage.getItem("tickets.motion") === "reduce"; } catch (_) {}
        return media.matches || storedReduce || document.documentElement.dataset.motion === "reduce";
      };
      let readyAt = null;
      let frame = 0;
      let lastFrame = -Infinity;
      let firstPaint = null;
      let exiting = false;
      let removed = false;
      let tearAt = null;
      let tearTimer;
      let columns = 0;
      let rows = 0;
      const FRAY_MS = 150;
      const MARK_EXIT_MS = 620;
      const BACKDROP_EXIT_MS = 280;

      const ready = () => { readyAt ??= performance.now(); };
      const remove = () => {
        if (removed) return;
        removed = true;
        cancelAnimationFrame(frame);
        clearTimeout(safety);
        clearTimeout(exitTimer);
        clearTimeout(tearTimer);
        document.removeEventListener("visibilitychange", visibility);
        window.removeEventListener("tickets:ready", ready);
        window.removeEventListener("resize", resize);
        splash.remove();
        window.dispatchEvent(new Event("tickets:splash-done"));
      };
      // A timer is independent of rAF (which pauses in background tabs).
      const safety = setTimeout(remove, 8000);
      let exitTimer;
      window.addEventListener("tickets:ready", ready);
      if (window.__ticketsReady) ready();

      function build() {
        columns = Math.max(36, Math.min(72, Math.round(innerWidth / 20)));
        rows = Math.round(columns / 3); // 24:16 logo, 0.5 character-cell aspect.
        const sample = 8;
        const canvas = document.createElement("canvas");
        canvas.width = columns * sample;
        canvas.height = rows * sample;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        if (!ctx) throw new Error("Canvas unavailable");
        ctx.scale(canvas.width / 24, canvas.height / 16);
        ctx.translate(-4, -8);
        // crates/web/icons/favicon.svg, including its three evenodd perforations.
        const stub = new Path2D("M6.5 8H25.5A2.5 2.5 0 0 1 28 10.5V13A3 3 0 0 0 28 19V21.5A2.5 2.5 0 0 1 25.5 24H6.5A2.5 2.5 0 0 1 4 21.5V19A3 3 0 0 0 4 13V10.5A2.5 2.5 0 0 1 6.5 8ZM19 11h2v2h-2ZM19 15h2v2h-2ZM19 19h2v2h-2Z");
        ctx.fill(stub, "evenodd");
        const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        const coverage = Array.from({ length: rows * columns }, (_, i) => {
          const x = i % columns, y = Math.floor(i / columns);
          let alpha = 0;
          for (let dy = 0; dy < sample; dy++) {
            for (let dx = 0; dx < sample; dx++) {
              alpha += pixels[((y * sample + dy) * canvas.width + x * sample + dx) * 4 + 3];
            }
          }
          return alpha / (255 * sample * sample);
        });
        // One shared occupancy threshold keeps the contour and holes continuous.
        const filled = coverage.map(value => value >= 0.5);
        const split = Math.round(columns * 2 / 3); // SVG x=20, relative to x=4..28.
        splash.style.setProperty("--boot-tear-origin", `${split / columns * 100}%`);
        pieces.forEach(piece => {
          piece.cells = [];
          piece.bodyBuffer = Array(rows * (columns + 1) - 1).fill(" ");
          piece.edgeBuffer = piece.bodyBuffer.slice();
          for (let y = 1; y < rows; y++) {
            piece.bodyBuffer[y * (columns + 1) - 1] = "\n";
            piece.edgeBuffer[y * (columns + 1) - 1] = "\n";
          }
        });
        filled.forEach((value, i) => {
          const x = i % columns, y = Math.floor(i / columns);
          const edge = value && [[-1, 0], [1, 0], [0, -1], [0, 1]].some(([dx, dy]) =>
            x + dx < 0 || x + dx >= columns || y + dy < 0 || y + dy >= rows ||
            !filled[(y + dy) * columns + x + dx]);
          if (!value) return;
          const piece = pieces[x < split ? 0 : 1];
          const index = y * (columns + 1) + x;
          const seam = x === split - 1 || x === split;
          const cell = { index, edge, seam, x: x / columns, y: y / rows,
            a: x * 0.28 + y * 0.36, b: x * 0.13 - y * 0.31,
            c: x * 0.39 + y * 0.12, phase: (y * 7 + x * 3) % 11 };
          piece.cells.push(cell);
          if (edge) piece.edgeBuffer[index] = "+";
        });
        splash.style.setProperty("--boot-columns", columns);
        splash.style.setProperty("--boot-rows", rows);
        // Fixed 0.6em cell advance / 1.2em line height prevents font-swap reflow.
        const fontSize = parseFloat(getComputedStyle(art).fontSize);
        splash.style.setProperty("--boot-scale",
          Math.min(innerWidth * 0.44, innerHeight * 0.9) / (columns * fontSize * 0.6));
      }
      // Reuse cell buffers; two body strings/Text.data writes per glyph frame.
      // The contour is written once, except for the short tear-line fray.
      function render(now = 0, fray = -1) {
        const t = now / 1000;
        const ramp = "ox+=*%$@";
        const waveA = t * 1.15, waveB = t * 0.73, waveC = t * 0.47;
        const highlight = (t * 0.16 + 0.45) % 2 - 0.5;
        for (const piece of pieces) {
          for (const cell of piece.cells) {
            const i = cell.index;
            if (fray >= 0 && cell.seam) {
              // Deterministic stagger, with progressive dropout rather than random noise.
              const dropout = cell.phase > 3 && fray > 0.45 + cell.phase / 20;
              const glyph = dropout ? " " : "·~,"[(Math.floor(fray * 5) + cell.phase) % 3];
              piece.bodyBuffer[i] = " ";
              piece.edgeBuffer[i] = glyph;
            } else if (!cell.edge) {
              const band = Math.max(0, 1 - Math.abs(cell.x + cell.y * 0.28 - highlight) / 0.22);
              const density = 0.52 + 0.19 * Math.sin(cell.a - waveA) +
                0.14 * Math.sin(cell.b - waveB) + 0.08 * Math.sin(cell.c + waveC) + band * 0.22;
              piece.bodyBuffer[i] = ramp[Math.max(0, Math.min(7, Math.floor(density * 8)))];
            }
          }
          if (!piece.bodyText) {
            piece.bodyText = document.createTextNode("");
            piece.edgeText = document.createTextNode(piece.edgeBuffer.join(""));
            piece.body.replaceChildren(piece.bodyText);
            piece.edge.replaceChildren(piece.edgeText);
          }
          piece.bodyText.data = piece.bodyBuffer.join("");
          if (fray >= 0) piece.edgeText.data = piece.edgeBuffer.join("");
        }
      }
      function resize() {
        if (exiting) return;
        try {
          pieces.forEach(piece => { piece.bodyText = null; });
          build(); render(reduced() ? 0 : performance.now());
        } catch (_) { remove(); }
      }
      function tick(now) {
        if (removed) return;
        if (!splash.isConnected) { remove(); return; }
        if (document.hidden) return;
        firstPaint ??= now;
        const elapsed = now - firstPaint;
        if (now - lastFrame >= 1000 / 30) {
          lastFrame = now - (Number.isFinite(lastFrame) ? (now - lastFrame) % (1000 / 30) : 0);
          const reduce = reduced();
          splash.classList.toggle("boot-reduced", reduce);
          if (exiting) {
            if (tearAt !== null && !reduce) {
              render(now, Math.min(1, (now - tearAt) / FRAY_MS));
              if (now - tearAt < FRAY_MS) frame = requestAnimationFrame(tick);
            }
            return;
          }
          if (!reduce) render(now);
          const busy = document.querySelector('body > :not(#boot-splash) [aria-busy="true"], body > [aria-busy="true"]');
          if (readyAt !== null && elapsed >= (reduced() ? 500 : 900) &&
              (!busy || now - readyAt >= 1500)) {
            exiting = true;
            // Timers advance the exit even when rAF stalls or the tab is hidden.
            if (!reduce) {
              tearAt = now;
              render(now, 0);
              tearTimer = setTimeout(() => {
                render(now + FRAY_MS, 1);
                splash.classList.add("boot-torn");
              }, FRAY_MS);
            }
            splash.classList.add("boot-leaving");
            exitTimer = setTimeout(() => {
              splash.classList.add("boot-exit");
              exitTimer = setTimeout(remove, BACKDROP_EXIT_MS);
            }, reduce ? 400 : MARK_EXIT_MS);
            if (!reduce) frame = requestAnimationFrame(tick);
            return;
          }
        }
        frame = requestAnimationFrame(tick);
      }
      function visibility() {
        if (!document.hidden && !removed) frame = requestAnimationFrame(tick);
        else cancelAnimationFrame(frame);
      }
      try {
        build();
        render(); // First paint already contains the outlined mark.
        splash.classList.toggle("boot-reduced", reduced());
        window.addEventListener("resize", resize);
        document.addEventListener("visibilitychange", visibility);
        frame = requestAnimationFrame(tick);
        // Float and fades are CSS on the compositor, so they keep moving while wasm compiles.
        requestAnimationFrame(() => requestAnimationFrame(() => splash.classList.add("boot-in")));
      } catch (_) { remove(); } // Unsupported canvas must never cover the app.
    })();
  </script>
  <noscript><style>#boot-splash { display: none; }</style>Enable JavaScript to use Tickets.</noscript>
</body>
</html>
