name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install wasm build tools
        run: cargo install worker-build --version 0.8.7 --locked && cargo install trunk --version 0.21.14 --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --prefix crates/web
      - run: npm install --global wrangler@4.154.0
      - run: cargo xtask ci
        env:
          LINT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
      - run: cargo xtask pickup-check
      - name: Reuse the verified application build for isolated checks
        run: echo 'TICKETS_SKIP_BUILD=1' >> "$GITHUB_ENV"
      - run: CHROME_BIN=google-chrome cargo xtask settings-check
      - run: cargo xtask skill-check
      - name: Test GitHub App callback without network
        run: node --test crates/worker/tests/github_app.mjs
      - run: cargo xtask import-check
      - run: CHROME_BIN=google-chrome cargo xtask mirror-check
      - run: CHROME_BIN=google-chrome cargo xtask first-run-check
      - run: CHROME_BIN=google-chrome cargo xtask detail-check
      - run: CHROME_BIN=google-chrome cargo xtask palette-check
      - run: CHROME_BIN=google-chrome cargo xtask project-repos-check
      - run: CHROME_BIN=google-chrome cargo xtask loading-check
      - run: CHROME_BIN=google-chrome cargo xtask component-shot all
      - run: CHROME_BIN=google-chrome cargo xtask home-shot
      - name: Upload Chromium startup logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chromium-startup-logs
          path: target/*chromium*.log
          if-no-files-found: warn
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm install --global wrangler@4.154.0
      # A fresh checkout has no .wrangler state; exercise the entire SQL chain.
      - run: cargo xtask migrate
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  deploy:
    # Production deploy on every merge to main, only after all checks pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, migrations, secrets]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tickets.worldwidewebb.co
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install wasm build tools
        run: cargo install worker-build --version 0.8.7 --locked && cargo install trunk --version 0.21.14 --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --prefix crates/web
      - run: npm install --global wrangler@4.154.0
      - name: Apply D1 migrations to production
        run: cargo xtask migrate --remote
      - run: cargo xtask build
      - name: Deploy Worker
        env:
          BOOTSTRAP_USERNAME: ${{ secrets.TICKETS_BOOTSTRAP_USERNAME }}
          BOOTSTRAP_PASSWORD_HASH: ${{ secrets.TICKETS_BOOTSTRAP_PASSWORD_HASH }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.TICKETS_GITHUB_WEBHOOK_SECRET }}
          GITHUB_APP_STORE_KEY: ${{ secrets.TICKETS_GITHUB_APP_STORE_KEY }}
          GITHUB_APP_SETUP_STATE: ${{ secrets.TICKETS_GITHUB_APP_SETUP_STATE }}
        run: |
          umask 077
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          jq -n '{BOOTSTRAP_USERNAME: env.BOOTSTRAP_USERNAME, BOOTSTRAP_PASSWORD_HASH: env.BOOTSTRAP_PASSWORD_HASH, GITHUB_WEBHOOK_SECRET: env.GITHUB_WEBHOOK_SECRET, GITHUB_APP_STORE_KEY: env.GITHUB_APP_STORE_KEY, GITHUB_APP_SETUP_STATE: env.GITHUB_APP_SETUP_STATE}' > "$secrets_file"
          wrangler deploy --env production --secrets-file "$secrets_file"
          rm -f "$secrets_file"
      - name: Smoke test
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS https://tickets.worldwidewebb.co/api/health; then
              status=$(curl -s -o /dev/null -w '%{http_code}' https://tickets.worldwidewebb.co/api/v1/tickets)
              test "$status" = 401 && exit 0
              echo "unauthenticated /api/v1 returned $status, expected 401"; exit 1
            fi
            sleep 10
          done
          exit 1
