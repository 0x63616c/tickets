[package]
name = "tickets-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
js-sys = "0.3.106"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Crypto", "CryptoKey", "SubtleCrypto"] }
worker = { version = "=0.8.7", features = ["d1"] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tickets-core = { version = "0.1.0", path = "../core" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures = { version = "0.3.34", default-features = false, features = ["executor"] }
rusqlite = { version = "0.41.0", features = ["bundled", "limits"] }
