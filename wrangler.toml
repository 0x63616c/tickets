name = "tickets"
main = "crates/worker/build/worker/shim.mjs"
compatibility_date = "2026-10-27"

[build]
command = "cd crates/worker && worker-build --release"

[assets]
directory = "crates/web/dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "tickets"
# Local-only placeholder; replace only during explicitly authorized provisioning.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Keep the Cloudflare account on Workers Free; Wrangler does not select billing plans.
[env.production]
name = "tickets-production"
workers_dev = false
preview_urls = false
routes = [{ pattern = "tickets.worldwidewebb.co", custom_domain = true }]

# D1 bindings are not inherited by named environments.
[[env.production.d1_databases]]
binding = "DB"
database_name = "tickets"
database_id = "aac62c45-1f61-4858-956f-c0e4556b52ab"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "BOARD_ROOMS"
class_name = "BoardRoom"

[[migrations]]
tag = "v1-board-room"
new_sqlite_classes = ["BoardRoom"]

[[env.production.durable_objects.bindings]]
name = "BOARD_ROOMS"
class_name = "BoardRoom"

# No scheduled issue reconciliation: Tickets is the system of record.
[triggers]
crons = []

[env.production.triggers]
crons = []
