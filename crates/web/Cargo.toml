[package]
name = "tickets-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tickets-core = { path = "../core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = "0.7.0"
console_error_panic_hook = "0.1"
gloo-timers = { version = "0.3", features = ["futures"] }
futures-util = "0.3"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "File", "FileList", "HtmlImageElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageBitmap", "Url", "Window", "Storage", "Navigator", "Clipboard", "HtmlDialogElement", "HtmlDetailsElement", "HtmlInputElement", "HtmlFormElement", "HtmlSelectElement", "HtmlElement", "DataTransfer", "DragEvent", "KeyboardEvent", "NodeList", "DomRect", "CssStyleDeclaration", "MediaQueryList", "ResizeObserver", "MutationObserver", "MutationObserverInit"] }
